# Qdrant service configuration for the CASTER RAG workspace.
#
# Loopback only: the service is not reachable from outside this machine. The
# paths are relative to the RAG workspace from which Qdrant is started.
# Copy this example to that workspace; keep deployment overrides local.
storage:
  storage_path: ./qdrant/storage
  snapshots_path: ./qdrant/snapshots
  hnsw_index:
    m: 16
    ef_construct: 100
  optimizers:
    default_segment_number: 2
service:
  host: 127.0.0.1
  http_port: 6333
  grpc_port: 6334
  enable_tls: false
  max_workers: 0
telemetry_disabled: true
log_level: INFO
