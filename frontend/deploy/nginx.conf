# Standalone static deployment on the same host as the API.
# Install dist/client/ into /srv/caster/ui and adapt root/upstream for your host.
server {
    listen 127.0.0.1:4173;
    server_name localhost;
    root /srv/caster/ui;
    index index.html;
    client_max_body_size 64m;

    location /api/v1/ {
        # No trailing slash: retain the versioned path.
        proxy_pass http://127.0.0.1:8189;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
